name: "Terraform AWS Deploy"

on:
  push:
    branches:
      - hardcode
  pull_request:
    branches:
      - main

# Permissions required for Git, OIDC authentication, and PR commenting
permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: "Terraform Automation"
    runs-on: ubuntu-latest
    env:
      AWS_REGION: "ap-south-2" # Replace with your target AWS region

    steps:
      # Step 1: Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Authenticate to AWS via OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          
          aws-region: ${{ env:AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN}} # e.g., arn:aws:iam::123456789012:role/GithubActionsTerraformRole

      # Step 3: Setup Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0" # Match your local terraform version

      # Step 4: Initialize Terraform (Includes S3 backend initialization)
      - name: Terraform Init
        id: init
        run: terraform init

      # Step 5: Check code formatting
      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check

      # Step 6: Generate Execution Plan
      - name: Terraform Plan
        id: plan
        if: github.event_name == 'pull_request'
        run: terraform plan -no-color
        continue-on-error: true

      # Step 7: Post Plan to Pull Request (Optional, helpful for team review)
      - name: Update Pull Request with Plan
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`hcl
            ${process.env.PLAN}
            \`\`\`

            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
        env:
          PLAN: "terraform\n${{ steps.plan.outputs.stdout }}"

      # Step 8: Apply Changes (Only runs on push to the main branch)
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve
