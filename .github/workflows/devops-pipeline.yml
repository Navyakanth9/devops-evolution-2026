---
name: DevOps Evolution 2026 Pipeline

on:
  push:
    branches:
      - main
      - hardcode
  workflow_dispatch:
     # INPUT 1: THE TARGET WORKSPACE
    inputs:
      environment:
        description: "Select your environment"
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
     # INPUT 2:  THE LIFECYCLE ACTION   
      action:
        description: 'Choose your Infrastructure Operation'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - destroy

permissions:
  id-token: write
  contents: read

jobs:
  #=====================================
  # STAGE 1: THE PLAN & VALIDATION LOOP
  #======================================

  terraform-plan:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: Cache Terraform Dependency Modules
        uses: actions/cache@v4
        with:
          path: |
            .terraform/
            .terraform.lock.hcl
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/*.tf*') }}
          restore-keys: |
            ${{ runner.os }}-terraform-
                      

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{secrets.AWS_IAM_ROLE_ARN}}
          aws-region: ap-south-2
          role-session-name: terraform-plan-session

      - name: Install Terraform Engine
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0
      
      - name: Initialize Terraform
        run: terraform init
        
     # WORKSPACE AUTOMATION HANDSHAKE
      - name: Select or Create Workspace Environment
        run: |
          # Read input environment selection, default to dev if triggered via code push
          TARGET_ENV="${{ github.event.inputs.environment || 'dev' }}"
          echo "Target isolation workspace: $TARGET_ENV"
          
          # Tell Terraform to try selecting the room. If it doesn't exist, create it live!
          terraform workspace select $TARGET_ENV || terraform workspace new $TARGET_ENV

      # EVALUATES WHETHER TO GENERATE A DEPLOYMENT PLAN OR A DESTRUCTION PLAN
      - name: Generate Spec Plan
        id: plan_step
        run: |
          if [ "${{ github.event.inputs.action }}" == "destroy" ]; then
            echo "Generating destruction manifest blueprint..."
            terraform plan -destroy -out=tfplan
          else
            echo "Generating standard deployment manifest blueprint..."
            terraform plan -out=tfplan
          fi

      # - name: Generate Spec plan
      #   run: terraform plan -out=tfplan

      # ARCHITECTURAL STEP: Upload the plan file securely to GitHub's storage memory  
      - name: Save Execution Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-tfplan
          path: tfplan
          retention-days: 1
  # ==========================================
  # STAGE 2: THE CONTROLLED DEPLOYMENT GATE
  # ==========================================
  terraform-apply:
    runs-on: ubuntu-latest
    # CRUCIAL: Do not run the apply unless the plan job finishes completely green!
    needs: terraform-plan
        # Ties this specific job to an explicit environment gate inside GitHub
    environment: Prod
    
    steps:
      - name: Checkout Code repository
        uses: actions/checkout@v4

      - name: Cache Terraform Dependency Modules
        uses: actions/cache@v4
        with:
          path: |
            .terraform/
            .terraform.lock.hcl
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/*.tf*') }}
          restore-keys: |
            ${{ runner.os }}-terraform-
  

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with: 
          role-to-assume: ${{secrets.AWS_IAM_ROLE_ARN}}
          aws-region: ap-south-2
          role-session-name: terraform-apply-session
          
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0
          
      - name: Initialize Terraform
        run: terraform init

        
      # WORKSPACE AUTOMATION HANDSHAKE
      - name: Select or Create Workspace Environment
        run: |
          # Read input environment selection, default to dev if triggered via code push
          TARGET_ENV="${{ github.event.inputs.environment || 'dev' }}"
          echo "Target isolation workspace: $TARGET_ENV"
          
          # Tell Terraform to try selecting the room. If it doesn't exist, create it live!
          terraform workspace select $TARGET_ENV || terraform workspace new $TARGET_ENV
      # Download the exact, validated plan binary artifact generated in Job 1
      
      - name: Download the Artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-tfplan

      - name: Execute Controlled Deployment
        run: terraform apply -auto-approve tfplan

            # DYNAMIC SUMMARY GENERATION STEP (WITH RUNTIME AUDIT CARD)
      - name: Generate Live Summary Dashboard
        if: always() # Forces this card to print on both Applys and Destroys!
        run: |
          # 1. Extract inputs and contextual run metadata strings
          TARGET_ENV="${{ github.event.inputs.environment || 'dev' }}"
          ACTION_OP="${{ github.event.inputs.action || 'push-deploy' }}"
          TRIGGERED_BY="${{ github.actor }}"
          RUN_ID="${{ github.run_id }}"
          
          # 2. Build the high-visibility Run Summary Audit Card
          echo "## 📊 GITOPS PIPELINE RUN AUDIT METADATA" >> $GITHUB_STEP_SUMMARY
          echo "│ Component │ Active Operational Value │" >> $GITHUB_STEP_SUMMARY
          echo "├───────────┼──────────────────────────┤" >> $GITHUB_STEP_SUMMARY
          echo "│ 👤 **Triggered By User** │ @$TRIGGERED_BY │" >> $GITHUB_STEP_SUMMARY
          echo "│ 🚀 **Target Workspace**  │ \`$TARGET_ENV\` │" >> $GITHUB_STEP_SUMMARY
          echo "│ 🛠️ **Requested Action**  │ \`$ACTION_OP\` │" >> $GITHUB_STEP_SUMMARY
          echo "│ 🆔 **Workflow Run ID**   │ \`$RUN_ID\` │" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY

          # 3. Append resource connection details ONLY if it wasn't a teardown execution
          if [ "$ACTION_OP" != "destroy" ] && [ "${{ job.status }}" == "success" ]; then
            PUBLIC_IP=$(terraform output -raw production_web_server_ip)
            SERVER_URL=$(terraform output -raw production_web_server_url)
            SSH_CMD=$(terraform output -raw production_ssh_command)
            
            echo "### 🟢 LIVE INFRASTRUCTURE ENDPOINTS" >> $GITHUB_STEP_SUMMARY
            echo "* **Public IP Address:** \`$PUBLIC_IP\`" >> $GITHUB_STEP_SUMMARY
            echo "* **Live Application Link:** [Click to Open Web App]($SERVER_URL)" >> $GITHUB_STEP_SUMMARY
            echo "* **Secure Connection Terminal String:**" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "$SSH_CMD" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          elif [ "$ACTION_OP" == "destroy" ] && [ "${{ job.status }}" == "success" ]; then
            echo "### 🚨 INFRASTRUCTURE TEARDOWN METRICS CONFIRMED" >> $GITHUB_STEP_SUMMARY
            echo "💥 **Status:** The isolated state room \`$TARGET_ENV\` has been completely decommissioned and synchronized to a \$0 zero-resource baseline." >> $GITHUB_STEP_SUMMARY
          fi






