name: DevOps Evolution CI-CD Pipeline

on:
  push:
    branches: [hardcode]

  workflow_dispatch:

# CRUCIAL FOR OIDC: Allows the runner to request secure identity tokens from AWS
permissions:
  id-token: write
  contents: read

jobs:
  terraform-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Clone the repository code
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      # 2. PASSWORDLESS AUTHENTICATION: Authenticate to AWS using OIDC via IAM Role Assume

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ap-south-2
          
